# kameziro.com.br → VPS 187.127.15.144
#
# DNS Hostinger (Domínios → kameziro.com.br → DNS / Zona DNS):
#   Tipo A | Nome: @   | Aponta para: 187.127.15.144
#   Tipo A | Nome: www | Aponta para: 187.127.15.144
#
# Na VPS:
#   sudo cp deploy/vps/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kameziro.com.br -d www.kameziro.com.br

server {
    listen 80;
    listen [::]:80;
    server_name kameziro.com.br www.kameziro.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
